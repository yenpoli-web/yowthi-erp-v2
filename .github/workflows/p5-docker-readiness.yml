name: p5-docker-readiness

on:
  push:
    branches:
      - p5-docker-readiness

permissions:
  contents: read

jobs:
  readiness:
    runs-on: [self-hosted, yowthi-erp-v2]
    timeout-minutes: 10

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Runner identity
        run: |
          whoami
          whoami /groups

      - name: Docker users group
        run: net localgroup docker-users || echo docker-users-query-failed

      - name: Docker Desktop service
        run: sc query com.docker.service || echo docker-service-query-failed

      - name: Docker Desktop status
        run: docker desktop status || echo docker-desktop-status-unavailable

      - name: Docker CLI and Compose
        run: |
          docker --version
          docker compose version

      - name: Docker Engine access
        run: docker info || echo docker-engine-access-unavailable
