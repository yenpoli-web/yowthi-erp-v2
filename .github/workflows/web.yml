name: web-self-hosted

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-typecheck-build:
    runs-on: [self-hosted, yowthi-erp-v2]
    timeout-minutes: 30

    defaults:
      run:
        working-directory: src/YowThi.Erp.Web

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: src/YowThi.Erp.Web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
