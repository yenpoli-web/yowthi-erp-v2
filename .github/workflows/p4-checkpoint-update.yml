name: p4-checkpoint-update

on:
  push:
    branches:
      - p4-checkpoint-update

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, yowthi-erp-v2]
    timeout-minutes: 15

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update checkpoint documents
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\p4-checkpoint-update.ps1

      - name: Validate diff
        run: |
          git diff --check
          git diff -- README.md docs/09-current-design-checkpoint.md

      - name: Commit updated checkpoint documents
        run: |
          git add README.md docs/09-current-design-checkpoint.md
          git diff --cached --quiet
          if %ERRORLEVEL% EQU 0 exit /b 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: checkpoint InitialV01 completion"
          git push origin HEAD:p4-checkpoint-update
