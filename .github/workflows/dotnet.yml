name: dotnet-self-hosted

on:
  push:
    branches:
      - "m*-validation"
      - "p*-validation"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: [self-hosted, yowthi-erp-v2]
    timeout-minutes: 30

    defaults:
      run:
        shell: cmd

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify .NET SDK
        run: |
          dotnet --version
          for /f "delims=" %%V in ('dotnet --version') do if not "%%V"=="10.0.400" exit /b 1

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore YowThi.Erp.slnx

      - name: Build
        run: dotnet build YowThi.Erp.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test YowThi.Erp.slnx --configuration Release --no-build
