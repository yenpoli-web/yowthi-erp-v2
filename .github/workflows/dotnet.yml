name: dotnet-self-hosted

on:
  push:
    branches:
      - "m*-validation"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: [self-hosted, yowthi-erp-v2]
    timeout-minutes: 30

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify .NET SDK
        shell: pwsh
        run: |
          $sdkVersion = dotnet --version
          if ($sdkVersion -ne "10.0.400") {
            throw "Expected .NET SDK 10.0.400 but found $sdkVersion. Install the repository-pinned SDK on the self-hosted runner."
          }

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore YowThi.Erp.slnx

      - name: Build
        run: dotnet build YowThi.Erp.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test YowThi.Erp.slnx --configuration Release --no-build
