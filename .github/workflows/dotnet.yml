name: dotnet-self-hosted

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: [self-hosted, yowthi-erp-v2]
    timeout-minutes: 30

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.400"

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore YowThi.Erp.slnx

      - name: Build
        run: dotnet build YowThi.Erp.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test YowThi.Erp.slnx --configuration Release --no-build
